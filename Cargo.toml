[package]
name = "veyra"
version = "0.2.0"
edition = "2021"
description = "Veyra – Motion for your universe. Schlanke, sichere Video-Hintergründe für den Desktop (Windows, später Linux)"
license = "MIT"
repository = "https://github.com/w3ssy/veyra"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
pollster = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
# Nur die Backends, die wir wirklich brauchen – weniger Code, weniger Angriffsfläche.
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "wgsl", "std"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Einstellungsfenster (eigener Prozess `veyra.exe --settings`, nur geladen, solange es offen ist).
# Nutzt dasselbe wgpu wie die Wallpaper-Ausgabe – keine zweite Grafik-Bibliothek.
[target.'cfg(windows)'.dependencies.eframe]
version = "0.37"
default-features = false
features = ["default_fonts", "wgpu_no_default_features"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
